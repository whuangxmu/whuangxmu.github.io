<script type="text/html" id="main">
    <div class="bs-docs-section">
        <h1 id="basic" class="page-header">基本要求</h1>
        <p>考勤以 <a href="https://course.xmu.edu.cn/" target="_blank">厦门大学课程中心</a> 的签到记录为准。</p>
        <p>考核异常情况应填写腾讯文档《黄指导课程出勤申诉表》（详见课程群通知）。</p>
    </div>
    <div class="bs-docs-section">
        <h1 id="leave" class="page-header">请假情形</h1>
        <h2 id="confict" class="page-header">课程冲突请假</h2>
        <p>课程冲突请假，无论初修（含：转专业生）、重修，应将教务系统截图作为证据。以下情况除外：</p>
        <ol>
            <li>冲突的两门课经改选其它平行班（包括经由教学秘书代选），可以避免冲突者。</li>
            <li>与校选修课冲突，经改选其它选修课可以避免冲突者。</li>
        </ol>
        <h2 id="evidence" class="page-header">突发请假</h2>
        <ol>
            <li>突发签到失败的学生应当场与主讲老师沟通，并保留QQ聊天记录证据。</li>
            <li>突发情况（身体不适、急事）应在第一时间（课程结束前）QQ联系主讲老师，保留QQ聊天记录证据。</li>
            <li>其它情况下，学生应依据 <a href="#xmu-leave-law">《厦门大学本科生考勤与请假管理暂行办法》</a> 办理手续，将院系批准的《厦门大学本科生请假单》拍照作为证据。</li>
        </ol>
        <h2 id="long" class="page-header">长期请假</h2>
        <ol>
            <li>此情况下，学生应依据 <a href="#xmu-leave-law">《厦门大学本科生考勤与请假管理暂行办法》</a> 办理手续，按请假时长等，将对应层级（校、院、系）批准的《厦门大学本科生请假单》拍照作为证据。</li>
        </ol>
    </div>
    <div class="bs-docs-section">
        <h1 id="ratio" class="page-header">请假要求</h1>
        <ol>
            <li>请假后，应及时（三日内）录入指定表单中。</li>
            <li>课程冲突请假不倒扣分，不计算总缺勤。</li>
            <li>突发请假不倒扣分，但计入总缺勤。</li>
            <li>长期请假不倒扣分，但计入总缺勤。</li>
            <li>不请假并未签到者均记为无故旷课。</li>
            <li>每节课迟到或早退超过10分钟，视为旷课0.5节，超过23--45分钟，视为旷课1节。</li>
        </ol>
    </div>
    <div class="bs-docs-section">
        <h1 id="law" class="page-header">相关规定</h1>
        <ul><li id="xmu-leave-law">《厦门大学本科生考勤与请假管理暂行办法》（厦大教〔2017〕99号）<ol>
            <li>第五条  擅自缺课、未请假或未准假而导致旷课的，根据学校有关规定给予批评教育，情节严重的，给予相应的纪律处分。一学期内旷课累计10学时以内，学生本人做书面检查；20学时以内，给予通报批评；30学时以内，视情节给予警告处分； 40学时以内，给予严重警告处分；50学时以内，给予记过处分。超过50学时，或者未经批准，一学期内连续离校天数达四天以上，经告诫不改的，视情节轻重给予留校察看以下处分。</li>
            <li>第六条  学校教学活动应坚持考勤制度，由任课教师负责。任课教师应及时将考勤缺勤情况报告开课单位，由开课单位负责向学生所在学院通报。</li>
            <li>第七条  学生请假，应当提交《厦门大学本科生请假单》，并附请假事由，请假条须经签字批准后方能生效。学生请假事由应当如实报告，不得捏造或者夸大，否则视情节轻重给予批评教育直至纪律处分。</li>
            <li>第八条  因病请假的，应附学校指定的二级甲等及以上医院证明。因参加学校组织的重大活动而须离校、无法参加课程学习时，应提交有关单位或组织出具的证明办理事假手续。如因参加就业面试、家中变故等确需请假的，应提供相关证明材料。</li>
            <li>第九条  原则上，请假均应报班主任批准。其中，请假天数在一天以上（含一天）三天以下的，由辅导员批准，学院备案；请假三天以上（含三天）七天以下的，由分管教学副院长批准，学院备案；七天以上（含七天）一个月以内的，由分管教学副院长和学院党委副书记共同批准，报学院、学生处备案。一个学期内连续请假超过一个月、或累计超过5周者，应当根据学校学籍管理有关规定办理休学手续。</li>
            <li>第十条  在外参加比赛、社会实践、田野调查等活动期间的请假，由带队老师或责任人批准。</li>
        </ol></li></ul>
    </div>
</script>
