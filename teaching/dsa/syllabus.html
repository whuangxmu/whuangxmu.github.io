    <div class="bs-docs-section">
        <h1 id="introduction" class="page-header">课程简介</h1>
        <p>
            课程性质：《数据结构与算法》是软件工程学科的一门核心专业基础课程，是学习操作系统、数据库系统、编译技术、算法分析和计算机网络等课程的基础。课程介绍软件设计中常用的数据结构与算法，以及常用的查找和排序技术，它将为后续课程的学习和软件设计水平的提高打下良好基础。
        </p>
        <p>
            课程主要内容包括：各种数据结构的逻辑特点、存储方法和基本运算；链表、循环链表、双向链表、栈和队列；树的基本概念，二叉树的性质、遍历和线索化，哈夫曼树；图的基本概念、存储结构、遍历和应用(最小生成树、拓扑排序、关键路径、最短路径)；顺序查找、折半查找、二叉排序树和哈希表等常用查找技术；插入排序、选择排序、冒泡排序、堆排序、快速排序和归并排序等常用排序技术。
        </p>
        <p>
            课程目标1：通过对数据结构基本知识、基本概念、基本技能的学习和训练，使学生理解数据结构的基本概念，掌握数据的逻辑结构、存储结构及其基本操作；
        </p>
        <p>
            课程目标2：培养学生利用计算机程序来处理和解决问题的基本能力，使其能够选择合适的数据结构和方法进行实际问题求解；
        </p>
        <p>
            课程目标3：培养学生用计算思维的方式解决复杂工程问题的意识和能力，为后续专业课程的学习和软件设计水平的提高打下良好基础。
        </p>
    </div>
    <div class="bs-docs-section">
        <h1 id="objective" class="page-header">培养目标</h1>
        <p>
            支持“指标点1.3”：能够将相关知识和数学模型方法用于推演、分析软件工程领域工程问题。本课程要求学生通过理论学习，上机实验等掌握信息学科必需的数理基础知识和思维方法，能够将数学、自然科学、工程基础和专业知识用于解决软件开发过程中的复杂工程问题。
        </p>
        <p>
            支持“指标点2.2”：能基于相关科学原理和数学模型方法正确表达软件工程领域复杂工程问题。本课程第一部分内容系统地介绍数据结构，算法和抽象数据类型的基本概念，以及一些基本的查找与排序算法，以增强学生对软件工程行业国内外开发现状的了解。
        </p>
        <p>
            支持“指标点2.3”：能认识到解决软件工程问题有多种方案可选择，会通过文献研究寻求可替代的解决方案。本课程第二部分内容详细介绍各种表结构的相关知识，包括线性表、链表、栈与队列、递归，以及散列表等，初步培养学生应用表结构进行实际问题分析与求解的能力。第三部分内容详细介绍树结构的相关知识，包括树的概念、二叉树遍历、哈夫曼树、二叉排序树，以及树的应用等，培养学生应用树结构分析与求解工程问题的能力。第四部分内容详细介绍图结构的相关知识，包括图的概念、图的遍历、最小生成树、最短路径、有向无环图等，进一步培养学生应用图结构分析与求解复杂工程问题的能力。本课程每一部分的内容都会提供大量实例、习题和实验，以增强学生的动手编程能力以及利用所学知识分析问题、解决问题的能力。
        </p>
    </div>
