<script type="text/html" id="main">
    <div class="bs-docs-section">
        <h1 id="basic" class="page-header">考察目标</h1>
        <ol>
            <li>掌握数据结构的基本概念、基本原理和基本方法。</li>
            <li>掌握数据的逻辑结构、存储结构及基本操作的实现，能够对算法进行基本的时间复杂度与空间复杂度的分析。</li>
            <li>能够运用数据结构的基本原理和方法进行问题的分析与求解，具备采用 C 或 C++语言设计与实现算法的能力。</li>
        </ol>
    </div>
    <div class="bs-docs-section">
        <h1 id="outline" class="page-header">考试内容</h1>
        <h2 id="01" class="page-header">一、基本概念</h2>
        <ol>
            <li>数据结构的基本概念：逻辑结构、存储结构及基本操作。</li>
            <li>算法的基本概念：特性、设计要求及复杂度分析（时间复杂度和空间复杂度）。</li>
        </ol>
        <h2 id="02" class="page-header">二、线性表</h2>
        <ol>
            <li>线性表的基本概念：定义、特征及实现方式。</li>
            <li>顺序存储（顺序表）的实现：结构定义、核心操作（初始化、查找、插入、删除）及特点。</li>
            <li>链式存储（链式表）的实现：结点结构、头指针与头结点、核心操作（创建、查找、插入、删除、销毁）及特点。</li>
            <li>线性表的应用：合并有序表、逆置链表、查找倒数第k个结点、约瑟夫环问题。</li>
        </ol>
        <h2 id="03" class="page-header">三、栈、队列和数组</h2>
        <ol>
            <li>栈和队列的基本概念：定义、核心特征（LIFO, FIFO）及基本操作。</li>
            <li>栈和队列的顺序存储结构：顺序栈、顺序队列（循环队列）的实现及操作。</li>
            <li>栈和队列的链式存储结构：链栈、链队列的实现及操作。</li>
            <li>多维数组的存储：行优先和列优先顺序及地址计算。</li>
            <li>特殊矩阵的压缩存储：对称矩阵、三角矩阵、稀疏矩阵（三元组、十字链表）。</li>
            <li>栈、队列和数组的应用：括号匹配、表达式求值、递归实现、层次遍历、广度优先搜索。</li>
            <li>串（String）：基本概念、存储结构及模式匹配算法（BF算法、KMP算法）。</li>
            <li>广义表（Generalized List）：基本概念、表头表尾及存储结构。</li>
        </ol>
        <h2 id="04" class="page-header">四、树和二叉树</h2>
        <ol>
            <li>树的基本概念：定义、基本术语（度、深度、叶子等）。</li>
            <li>二叉树：定义、特性、存储结构（顺序、链式）、遍历（先序、中序、后序、层次）及线索二叉树。</li>
            <li>树、森林：存储结构、与二叉树的转换及遍历。</li>
            <li>树和二叉树的应用：哈夫曼树和哈夫曼编码、并查集、堆及其应用。</li>
        </ol>
        <h2 id="05" class="page-header">五、图</h2>
        <ol>
            <li>图的基本概念：定义、术语（度、连通性、生成树等）。</li>
            <li>图的存储及基本操作：邻接矩阵、邻接表、邻接多重表、十字链表。</li>
            <li>图的遍历：深度优先搜索（DFS）、广度优先搜索（BFS）。</li>
            <li>图的基本应用：最小（代价）生成树（Prim算法、Kruskal算法）、最短路径（Dijkstra算法、Floyd算法）、拓扑排序、关键路径。</li>
        </ol>
        <h2 id="06" class="page-header">六、查找</h2>
        <ol>
            <li>查找的基本概念：定义、平均查找长度（ASL）。</li>
            <li>顺序查找法：算法思想、性能分析及适用场景。</li>
            <li>分块查找法：算法思想、查找过程及性能分析。</li>
            <li>折半查找法：算法思想、实现及性能分析。</li>
            <li>树型查找：二叉搜索树（BST）、平衡二叉树（AVL）、红黑树。</li>
            <li>B树及其基本操作、B+树的基本概念。</li>
            <li>散列（Hash）表：基本概念、哈希函数构造、冲突处理方法及性能分析。</li>
            <li>字符串模式匹配：BF算法、KMP算法。</li>
            <li>查找算法的分析及应用。</li>
        </ol>
        <h2 id="07" class="page-header">七、排序</h2>
        <ol>
            <li>排序的基本概念：稳定性、内部排序与外部排序。</li>
            <li>插入排序：直接插入排序、折半插入排序、希尔排序。</li>
            <li>交换排序：起泡排序（Bubble Sort）、快速排序。</li>
            <li>选择排序：简单选择排序、堆排序。</li>
            <li>归并排序：二路归并排序（Merge Sort）。</li>
            <li>基数排序：算法思想及性能分析。</li>
            <li>外部排序：基本思想及过程。</li>
            <li>排序算法的分析与应用：综合对比及应用场景选择。</li>
        </ol>
    </div>
